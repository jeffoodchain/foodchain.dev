<header class="post-header">
  <h1>{{title}}</h1>
  <p class="meta">
    <time datetime="{{isoDate}}">{{date}}</time>
    <span class="sep">·</span>
    <span class="category">{{category}}</span>
  </p>
</header>

<article class="prose blog-content">
  {{content}}
</article>
